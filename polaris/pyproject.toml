[project]
name = "polaris"
version = "0.1.0"
description = "Build, simulate, analyse and export Modelica models across multiple compiler backends"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "fmpy",
    "OMPython",
    "SALib",
]

[project.optional-dependencies]
dashboard = ["dash"]
helics = ["helics"]

[project.scripts]
polaris = "polaris.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "pandas-stubs>=3.0.5.260914",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polaris"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a real Modelica compiler on PATH"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["fmpy.*", "helics.*", "OMPython.*", "SALib.*", "plotly.*"]
ignore_missing_imports = true
