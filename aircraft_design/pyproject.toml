[project]
name = "aircraft-design"
version = "0.1.0"
description = "Aircraft design"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aerosandbox[full]>=4.2.10",
    "avlpy",
    "charm",
    "degen-geom",
    "flightgear-python>=2.1.0",
    "jsbsim>=1.3.3",
    "openvsp",
    "openvsp-config",
    "pandas-stubs~=2.3.3",
    "pypmarc",
    "scipy-stubs~=1.18.1",
    "six>=1.17.0",
    "utilities",
    "vsp-airfoils",
]

[tool.ruff.lint.isort]
no-lines-before = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.uv.sources]
vsp-airfoils = { path = "OpenVSP/python/vsp_airfoils" }
utilities = { path = "OpenVSP/python/utilities" }
degen-geom = { path = "OpenVSP/python/degen_geom" }
openvsp-config = { path = "OpenVSP/python/openvsp_config" }
openvsp = { path = "OpenVSP/python/openvsp" }
charm = { path = "OpenVSP/python/CHARM" }
avlpy = { path = "OpenVSP/python/AvlPy" }
pypmarc = { path = "OpenVSP/python/pyPMARC" }
